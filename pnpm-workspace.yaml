packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
overrides:
  # Transitive dev-tooling vulnerabilities (eslint/svgr/shadcn's ts-morph
  # chain), unrelated to any app code — see GHSA-3jxr-9vmj-r5cp (ReDoS) and
  # GHSA-52cp-r559-cp3m (quadratic CPU). Scoped to each vulnerable range so
  # every existing major-version lineage still resolves to a compatible,
  # patched version rather than forcing an unrelated major everywhere.
  "brace-expansion@>=1.0.0 <1.1.16": ">=1.1.16 <2.0.0"
  "brace-expansion@>=2.0.0 <2.1.2": ">=2.1.2 <3.0.0"
  "brace-expansion@>=3.0.0 <5.0.7": ">=5.0.7"
  "js-yaml@>=4.0.0 <4.3.0": ">=4.3.0 <5.0.0"
  # GHSA-4c8g-83qw-93j6 (host-confusion via failed IDN canonicalization),
  # via shadcn's dotenvx/conf/ajv chain — same pattern as above.
  "fast-uri@>=3.0.0 <3.1.3": ">=3.1.3"
  # GHSA-f88m-g3jw-g9cj (libvips CVE-2026-33327/33328/35590/35591), via
  # next's bundled sharp — same pattern as above.
  "sharp@<0.35.0": ">=0.35.0"
